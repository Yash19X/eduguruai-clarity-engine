<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EduGuruAI – Clarity Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>EduGuruAI – Clarity Engine</h1>
    <p class="tagline">
      Human Intelligence OS • Turning Confusion into Direction
    </p>

    <textarea
      id="answers"
      rows="7"
      placeholder="Ask in Hindi or English. You may ask multiple questions..."
    ></textarea>

    <p class="hint">
      Text or voice — EduGuruAI will detect language and clarify each question.
    </p>

    <div class="button-row">
      <button onclick="startVoice()">🎤 Speak</button>
      <button onclick="getClarity()">Get Clarity</button>
      <button onclick="speakLast()">🔊 Speak Clarity</button>
    </div>

    <div class="button-row">
      <button onclick="setDemoPrompt('career')">⚡ Career</button>
      <button onclick="setDemoPrompt('study')">⚡ Study</button>
      <button onclick="setDemoPrompt('decision')">⚡ Decision</button>
      <button onclick="clearDecisionHistoryUI()">🗑️ Clear</button>
    </div>

    <!-- STATUS / LOADER -->
    <div id="statusBar" class="status hidden">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="statusText">EduGuruAI is analyzing…</span>
    </div>

    <h2>Your Clarity Report</h2>

    <!-- OUTPUT CARDS -->
    <div id="outputCards" class="outputCards"></div>

    <!-- QUICK REPLIES -->
    <div class="quickReplies">
      <button onclick="quickAction('short')">✨ Make it Short</button>
      <button onclick="quickAction('steps')">🧠 Explain Steps</button>
      <button onclick="quickAction('actions')">✅ 3 Next Actions</button>
    </div>

    <footer>
      <hr />
      <p>
        © 2026 EduGuruAI • Human Intelligence OS<br />
        Built for AI Manthan & Microsoft Imagine Cup
      </p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
